name: keuangan_rumah_tangga
description: Aplikasi tracking pemasukan & pengeluaran bulanan rumah tangga.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
